<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>业务员 · 提交需求</title>
  <link rel="stylesheet" href="/static/app.css?v=20260812-3">
</head>
<body>
  <div class="wrap">
    <div class="topnav">
      <span class="brand">业务员 · 需求</span>
      <a href="/">首页</a>
      <a href="/sales/demands">检查 / 修改</a>
    </div>

    <div class="card">
      <h1>提交切割需求</h1>
      <p class="muted">一次可添加多个客户；每个客户可添加多种材料（分隔显示），每种材料各自填写件明细。外框须小于板材 {{ sheet_w|default(120)|int }}×{{ sheet_h|default(100)|int }} cm。板材宽高由操作员拼板时手填。</p>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post" action="/sales/submit" id="salesForm" autocomplete="off">
        <div class="row cols-2">
          <div>
            <label>业务日期</label>
            <input type="date" name="work_date" value="{{ today }}" required>
          </div>
          <div>
            <label>提交人 *</label>
            <input name="submitter" value="{{ submitter or '' }}" required autocomplete="name" placeholder="首次必填，之后本机自动记住">
          </div>
        </div>

        <div id="customerBlocks"></div>
        <div class="actions">
          <button type="button" class="btn secondary" onclick="addCustomer()">＋ 添加客户</button>
          <button type="submit" class="btn">全部提交</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    const CATALOG = {{ catalog | tojson }};
    let blockSeq = 0;
    let matSeq = 0;

    function matOptionsHtml(selectedId) {
      return CATALOG.map(m =>
        `<option value="${m.id}" ${String(m.id) === String(selectedId) ? 'selected' : ''}>${m.name}</option>`
      ).join('');
    }

    function itemRowHtml(mi) {
      return `<tr>
        <td><input type="hidden" name="i_msec" value="${mi}">
            <input name="ow" inputmode="decimal"></td>
        <td><input name="oh" inputmode="decimal"></td>
        <td><input name="iw" inputmode="decimal" placeholder="实心留空"></td>
        <td><input name="ih" inputmode="decimal" placeholder="实心留空"></td>
        <td><input name="qty" inputmode="numeric" value="1"></td>
        <td style="white-space:nowrap">
          <input type="hidden" name="hole_left" value="">
          <input type="hidden" name="hole_bottom" value="">
          <button type="button" class="btn secondary small" data-hole-btn title="画框中孔位置">中孔偏移</button>
          <span class="hole-tip">居中</span>
          <button type="button" class="btn secondary small" onclick="delItem(this)">删</button>
        </td>
      </tr>`;
    }

    function pickDefaultMatId(blockEl) {
      const used = new Set(
        [...blockEl.querySelectorAll('select[name="m_mat"]')].map(s => s.value)
      );
      const prefer = CATALOG.find(m => m.name === '白卡纸' && !used.has(String(m.id)));
      if (prefer) return prefer.id;
      const free = CATALOG.find(m => !used.has(String(m.id)));
      return free ? free.id : (CATALOG[0] && CATALOG[0].id);
    }

    function matSectionHtml(bi, mi, matId) {
      return `
        <section class="mat-section" data-mi="${mi}">
          <div class="mat-section-head">
            <div class="mat-section-title">
              <label>材料种类 *</label>
              <select name="m_mat" required>
                ${matOptionsHtml(matId)}
              </select>
              <input type="hidden" name="m_block" value="${bi}">
              <input type="hidden" name="m_msec" value="${mi}">
            </div>
            <button type="button" class="btn secondary small" onclick="removeMatSection(this)">移除材料</button>
          </div>
          <h3>件明细</h3>
          <table>
            <thead>
              <tr><th>外框宽（cm）</th><th>外框高（cm）</th><th>内孔宽（cm）</th><th>内孔高（cm）</th><th>数量</th><th></th></tr>
            </thead>
            <tbody class="item-body">${itemRowHtml(mi)}</tbody>
          </table>
          <button type="button" class="btn secondary small" onclick="addItem(this, ${mi})">＋ 增加一行</button>
          <p class="muted" style="margin-top:8px">带孔件=画框（要外减孔）。默认孔居中；少用时点「中孔偏移」。</p>
        </section>`;
    }

    function addMatSection(blockEl, bi) {
      const mi = matSeq++;
      const matId = pickDefaultMatId(blockEl);
      blockEl.querySelector('.mat-sections').insertAdjacentHTML(
        'beforeend', matSectionHtml(bi, mi, matId)
      );
    }

    function removeMatSection(btn) {
      const block = btn.closest('.customer-block');
      const sections = block.querySelectorAll('.mat-section');
      if (sections.length <= 1) {
        alert('每个客户至少保留一种材料');
        return;
      }
      btn.closest('.mat-section').remove();
    }

    function addCustomer() {
      const bi = blockSeq++;
      const box = document.createElement('div');
      box.className = 'card customer-block';
      box.dataset.bi = bi;
      box.innerHTML = `
        <div class="cust-head">
          <h2>客户 #${bi + 1}</h2>
          <button type="button" class="btn secondary small" onclick="removeCustomer(this)">移除客户</button>
        </div>
        <div class="row cols-3">
          <div>
            <label>客户代码 *</label>
            <input name="c_code" required placeholder="如 A012">
          </div>
          <div>
            <label>客户名</label>
            <input name="c_name" placeholder="可选">
          </div>
          <div>
            <label>备注</label>
            <input name="c_note" placeholder="可选">
          </div>
        </div>
        <div class="mat-sections"></div>
        <div class="actions" style="margin-top:4px">
          <button type="button" class="btn secondary small" data-add-mat>＋ 添加材料</button>
        </div>
      `;
      box.querySelector('[data-add-mat]').onclick = () => addMatSection(box, bi);
      document.getElementById('customerBlocks').appendChild(box);
      addMatSection(box, bi);
    }

    function removeCustomer(btn) {
      const root = document.getElementById('customerBlocks');
      if (root.querySelectorAll('.customer-block').length <= 1) {
        alert('至少保留一个客户');
        return;
      }
      btn.closest('.customer-block').remove();
    }

    function addItem(btn, mi) {
      btn.closest('.mat-section').querySelector('.item-body')
        .insertAdjacentHTML('beforeend', itemRowHtml(mi));
    }

    function delItem(btn) {
      const body = btn.closest('tbody');
      if (body.rows.length <= 1) return;
      btn.closest('tr').remove();
    }

    addCustomer();
  </script>
  <script>
    window.CUT_SHEET = { w: {{ sheet_w|default(120) }}, h: {{ sheet_h|default(100) }} };
  </script>
  <script src="/static/submitter_cache.js"></script>
  <script src="/static/hole_offset.js"></script>
  <script src="/static/item_validate.js"></script>
</body>
</html>
